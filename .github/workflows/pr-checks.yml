name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rules & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules emulator tests
        run: npm run test:rules

      - name: Run unit tests
        run: npm run test:unit
